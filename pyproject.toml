[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-agents"
version = "0.1.0"
description = "Portable contracts for a local-first SDLC agent platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.3,<7",
    "jsonschema>=4.23,<5",
    "typer>=0.16,<1",
]

[project.scripts]
sdlc-agents = "sdlc_agents.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "foundation/src"}

[tool.setuptools.packages.find]
where = ["foundation/src"]
include = ["sdlc_agents", "sdlc_agents.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
